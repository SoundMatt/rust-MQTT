name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Core build & test ──────────────────────────────────────────────────────
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: fmt
        run: cargo fmt --check

      - name: clippy (§20.1.2)
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --locked

      - name: Dependency vulnerability audit (§20.1.2)
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: build release binary
        run: cargo build --release --bin rust-mqtt --locked

      - name: smoke test CLI (RELAY §12)
        run: |
          ./target/release/rust-mqtt version --format json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['tool'] == 'rust-mqtt', f'bad tool: {d}'
          assert d['protocol'] == 'MQTT', f'bad protocol: {d}'
          assert d['protocol_int'] == 4, f'bad protocol_int: {d}'
          assert d['spec_version'] == '2.0', f'bad spec_version: {d}'
          assert d['language'] == 'rust', f'bad language: {d}'
          print('version JSON OK')
          "
          ./target/release/rust-mqtt capabilities | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['kind'] == 'capabilities', f'bad kind: {d}'
          assert d['adapt'] == True, f'adapt must be true: {d}'
          assert d['protocol'] == 'MQTT', f'bad protocol: {d}'
          assert 'convert' in d['commands'], f'convert missing: {d}'
          print('capabilities JSON OK')
          "
          ./target/release/rust-mqtt status --format json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['protocol'] == 'MQTT', f'bad protocol: {d}'
          assert d['healthy'] == True, f'should be healthy: {d}'
          print('status JSON OK')
          "
          echo '{"topic":"sensors/temp","payload":"MjEuNQ==","qos":1,"retained":true}' \
            | ./target/release/rust-mqtt convert --protocol MQTT | python3 -c "
          import json, sys, base64
          d = json.load(sys.stdin)
          assert d['id'] == 'sensors/temp', f'bad id: {d}'
          assert d['protocol'] == 4, f'bad protocol: {d}'
          assert base64.b64decode(d['payload']) == b'21.5', f'bad payload: {d}'
          assert d['meta']['mqtt.qos'] == '1', f'bad qos meta: {d}'
          assert d['meta']['mqtt.retained'] == 'true', f'bad retained meta: {d}'
          print('convert JSON OK')
          "
          convert_ec=0
          echo '{"topic":"","payload":""}' \
            | ./target/release/rust-mqtt convert --protocol MQTT || convert_ec=$?
          test "$convert_ec" -eq 1 && echo 'convert exit-1 on invalid input OK' || \
            { echo "FAIL: expected exit 1, got $convert_ec"; exit 1; }
          proto_ec=0
          ./target/release/rust-mqtt convert --protocol CAN </dev/null || proto_ec=$?
          test "$proto_ec" -eq 2 && echo 'convert exit-2 on bad protocol OK' || \
            { echo "FAIL: expected exit 2, got $proto_ec"; exit 1; }
          printf '{"protocol":4,"version":{"major":0,"minor":0,"patch":0},"id":"test/t","payload":"aGVsbG8=","timestamp":"1970-01-01T00:00:00Z","meta":{"mqtt.qos":"0","mqtt.retained":"false"}}\n' \
            | ./target/release/rust-mqtt send --format json --mock && echo 'send --format json --mock OK'

  # ── RELAY conformance gate (§20.1.1) ──────────────────────────────────────
  relay-conform:
    name: RELAY conform (§20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-relay-${{ hashFiles('**/go.sum') }}

      - name: Install relay CLI
        # SoundMatt/RELAY fixed its go.mod module path in v2.0.4 (closes
        # RELAY#70): it now declares "github.com/SoundMatt/RELAY/v2" per
        # Go's semantic import versioning rules, so normal tag-based
        # `go install` works again. No more commit-hash workaround needed.
        run: go install github.com/SoundMatt/RELAY/v2/cmd/relay@v2.0.4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-relay-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI
        run: cargo build --release --bin rust-mqtt --locked

      - name: relay conform --strict
        run: relay conform --strict ./target/release/rust-mqtt

      - name: relay interop --strict (§20.2)
        # `relay interop` takes the binary as a positional argument, not
        # `--impl` — that flag has never existed (verified against
        # cmd/relay/interop.go, which parses via `fs.Args()`). The old
        # invocation always hit a flag-parse error, was swallowed by
        # `2>/dev/null`, and silently fell through to the "non-blocking"
        # branch — so this gate never actually ran. Fixed to the real
        # syntax and confirmed locally: `relay interop --strict --protocol
        # MQTT ./target/release/rust-mqtt` reports EQUIVALENT for both
        # `relay` (reference) and `rust-mqtt`, so the gate is now blocking.
        run: relay interop --strict --protocol MQTT ./target/release/rust-mqtt

  # ── Live-broker + third-party-peer interop (ROADMAP.md "Interop testing") ─
  mqtt-interop:
    name: MQTT interop against a live Mosquitto broker (ROADMAP.md "Interop testing")
    runs-on: ubuntu-latest
    services:
      # Real Eclipse Mosquitto broker for genuine MQTT wire traffic over TCP.
      # No special OS privileges needed (unlike the DDS/CAN sibling repos'
      # UDP-multicast/SocketCAN interop harnesses) — a plain service
      # container with the default port mapped is sufficient.
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-mqtt-interop-${{ hashFiles('**/Cargo.lock') }}

      - name: Install mosquitto-clients (mosquitto_pub/mosquitto_sub — the independent third-party validator)
        run: sudo apt-get update && sudo apt-get install -y mosquitto-clients

      # Probe-then-skip-cleanly posture (mirrors rust-DDS's `cyclone-interop`
      # CI job): the `services:` container starts alongside the job but
      # without a declared health check there is no guarantee its listener
      # is accepting connections yet by the time this step runs, and a
      # broker that never becomes reachable for any other reason should
      # leave this job green (not red) rather than blocking ordinary CI on
      # an environment dependency — see tests/mqtt_interop.rs's module doc
      # comment for the same posture at the individual-test level.
      - name: Probe live Mosquitto broker availability
        id: probe
        run: |
          for i in $(seq 1 30); do
            if mosquitto_pub -h localhost -p 1883 -t 'ci/mqtt-interop/probe' -m 'probe' -q 0 2>/dev/null; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Mosquitto broker not reachable on localhost:1883 after 30s — skipping live-broker interop tests"

      - name: Live MQTT interop (real-broker round-trip + mosquitto_pub/mosquitto_sub third-party-peer interop)
        if: steps.probe.outputs.available == 'true'
        run: cargo test --release --features mqtt-interop --test mqtt_interop -- --ignored --test-threads=1
        env:
          MQTT_INTEROP_BROKER: "127.0.0.1:1883"
          MQTT_INTEROP_TIMEOUT_SECS: "15"

  # ── ASIL-B safety checks via rust-FuSa (§20.1.2) ─────────────────────────
  safety:
    name: ASIL-B safety (x-FuSa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-safety-${{ hashFiles('**/Cargo.lock') }}

      - name: Install rsfusa
        run: cargo install --git https://github.com/SoundMatt/rust-FuSa --tag v0.3.17 rsfusa --locked

      - name: Build release binary (needed for qualify)
        run: cargo build --release --locked

      - name: Run cargo tests (unit + integration)
        run: cargo test --locked

      - name: Capture test evidence with rsfusa
        run: rsfusa verify --dir . || true

      - name: Coding standard lint (ISO 26262 Part 6)
        run: rsfusa lint --dir . --format json --output lint-report.json || true

      - name: Static analysis
        run: rsfusa analyze --dir . --format json --output analyze-report.json || true

      - name: Safety check (ASIL-B — §20.1.2)
        # Un-masked from `|| true` (this pass's gap-audit fix): ERROR-severity
        # findings now genuinely gate the build, closing the real hole where
        # `check` could fail outright (as it did here: no .fusa.json existed
        # in this repo at all -- fixed alongside this change) with CI staying
        # green regardless. Deliberately NOT --strict: that additionally
        # gates on every open WARNING finding, and this repo currently has
        # 210 of them (function-length/nesting/cyber-hygiene style findings,
        # not conformance defects) with none yet formally dispositioned
        # (accepted/deferred) via rsfusa's own disposition mechanism --
        # forcing all-warnings-zero here would require a dedicated triage
        # pass, not a byproduct of this conformance fix. Follow-up: run
        # `rsfusa check --strict`, disposition or fix each finding, then
        # add --strict back.
        run: rsfusa check --dir . --format json --output check-report.json

      - name: Safety check SARIF (GitHub code scanning)
        run: rsfusa check --dir . --format sarif --output results.sarif || true

      - name: Cyclomatic complexity V(G)
        run: rsfusa comp --dir . --format json --output comp-report.json || true

      - name: Requirement traceability matrix (§20.1.2)
        run: |
          rsfusa trace --dir . --format json --output trace.json || true
          rsfusa trace --dir . --format text || true

      - name: FMEA
        run: rsfusa fmea --dir . || true

      - name: Threat analysis (TARA)
        run: rsfusa tara --dir . || true

      - name: Cybersecurity analysis (CWE)
        run: rsfusa cyber --dir . --format json --output cyber-report.json || true

      - name: Boundary diagram
        run: rsfusa boundary --dir . || true

      - name: HARA
        run: |
          rsfusa hara show --dir . || true
          rsfusa hara validate --dir . || true

      - name: Safety case assembly
        run: rsfusa safety-case --dir . || true

      - name: ISO 26262 Part 6 gap report
        run: rsfusa iso26262 --dir . --format json --output iso26262-gap-report.json || true

      - name: Tool qualification
        run: rsfusa qualify

      - name: Release artifacts (SBOM, provenance, manifest)
        run: rsfusa release --dir .

      - name: Audit pack
        run: rsfusa audit-pack --output audit-pack.zip || true

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

      - name: Upload safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-evidence
          path: |
            check-report.json
            lint-report.json
            analyze-report.json
            comp-report.json
            cyber-report.json
            trace.json
            fmea.json
            tara.json
            hara.json
            safety-case.json
            safety-case.md
            boundary-diagram.json
            SAFETY_MANUAL.md
            sbom.json
            provenance.json
            requirements.json
            iso26262-gap-report.json
            results.sarif
            audit-pack.zip
